[project]
name = "echochamber"
version = "0.1.0"
description = "Multi-LLM Courtroom Debate Environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Core has no hard dependencies — providers and features are lazily imported.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]  # Also used for Together.AI and LM Studio
gemini = ["google-genai>=1.0.0"]
search = ["ddgs>=6.0.0"]
ui = ["gradio>=5.0.0"]
pdf = ["pymupdf>=1.24.0"]
rag = ["chromadb>=0.5.0"]
batch = ["pyyaml>=6.0"]
env = ["python-dotenv>=1.0.0"]
all = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "ddgs>=6.0.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",  # batch config-loading tests
]

[project.scripts]
echochamber = "echochamber.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echochamber*"]

[tool.setuptools.package-data]
echochamber = ["data/*.json"]
